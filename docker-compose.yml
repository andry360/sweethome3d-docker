services:
  sweethome3d:
    build:
      context: .
      dockerfile: Dockerfile
    image: sweethome3d-online:${VERSION:-7.7}
    container_name: sweethome3d-online
    restart: unless-stopped
    
    ports:
      - "${HOST_PORT:-8080}:80"
    
    environment:
      # PHP Configuration
      - UPLOAD_MAX_FILESIZE=${UPLOAD_MAX_FILESIZE:-50M}
      - POST_MAX_SIZE=${POST_MAX_SIZE:-50M}
      - MEMORY_LIMIT=${MEMORY_LIMIT:-256M}
      
      # Sweet Home 3D Configuration
      - SH3D_STORAGE_PATH=/var/www/html/homes
      
      # Authentication (optional)
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
    
    volumes:
      # Storage for saved homes (bind mount with proper propagation)
      - type: bind
        source: ${STORAGE_PATH:-./homes}
        target: /var/www/html/homes
        bind:
          propagation: rprivate
      
      # Optional: Custom PHP configuration
      # - type: bind
      #   source: ./docker/php.ini
      #   target: /usr/local/etc/php/conf.d/custom.ini
      
      # Optional: Custom Apache configuration
      # - type: bind
      #   source: ./docker/apache-config.conf
      #   target: /etc/apache2/sites-available/000-default.conf
    
    networks:
      - sweethome3d_network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "-o", "/dev/null", "-w", "%{http_code}", "-s", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=false"

networks:
  sweethome3d_network:
    driver: bridge

volumes:
  homes:
    driver: local
