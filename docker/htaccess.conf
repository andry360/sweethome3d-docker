# Sweet Home 3D .htaccess
# HTTP Basic Authentication

# Uncomment the following lines to enable authentication
# AuthType Basic
# AuthName "Sweet Home 3D - Private Access"
# AuthUserFile /var/www/.htpasswd
# Require valid-user

# Allow access to homes directory only via PHP
<FilesMatch "^(index\.html|.*\.php)$">
    # Allow access
</FilesMatch>

# Deny direct access to .sh3d files
<FilesMatch "\.sh3d$">
    Require all denied
</FilesMatch>

# Enable rewrite engine for clean URLs (optional)
RewriteEngine On
