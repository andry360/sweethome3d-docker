# Sweet Home 3D .htaccess
# HTTP Basic Authentication & Security Rules

# Uncomment the following lines to enable authentication
# AuthType Basic
# AuthName "Sweet Home 3D - Private Access"
# AuthUserFile /var/www/.htpasswd
# Require valid-user

# Default: Deny all access
<FilesMatch ".*">
    Require all denied
</FilesMatch>

# Allow access to specific files only
<FilesMatch "^(index\.html|.*\.php|.*\.js|.*\.css|.*\.json|.*\.png|.*\.jpg|.*\.jpeg|.*\.gif|.*\.svg|.*\.woff|.*\.woff2|.*\.ttf|.*\.eot)$">
    Require all granted
</FilesMatch>

# Explicitly deny access to project files (.sh3d) and sensitive files
<FilesMatch "\.(sh3d|php~|bak|sql|zip|tar|gz|rar)$">
    Require all denied
</FilesMatch>

# Deny access to hidden files and directories
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Enable rewrite engine for clean URLs
RewriteEngine On
RewriteBase /

# Protect sensitive directories
<Directory /var/www/html/homes>
    Options -Indexes -FollowSymLinks
    Require all denied
</Directory>
