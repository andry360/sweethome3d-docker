# Apache configuration for Sweet Home 3D
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable authentication if AUTH_ENABLED is set
        # This will be handled by .htaccess
    </Directory>

    # Directory for saved homes
    <Directory /var/www/html/homes>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    # PHP files
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
